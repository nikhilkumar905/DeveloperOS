# Render Blueprint: creates the API and the chat service from this repository.
# Render dashboard -> New -> Blueprint -> pick this repo. Values marked `sync: false` are asked for
# during setup (they are secrets or depend on your Vercel URL) and are never stored in the repo.
# Full guide: docs/DEPLOYMENT.md

services:
  - type: web
    name: developeros-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./fastapi-backend
    dockerfilePath: ./fastapi-backend/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      # Random secret generated by Render; the chat service reads the same value below
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: personalos
      # Your Vercel URL, e.g. https://developeros.vercel.app (no trailing slash)
      - key: FRONTEND_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # https://<your-vercel-app>.vercel.app/api/auth/google/callback
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # https://<your-vercel-app>.vercel.app/api/github/callback
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: developeros-chat
    runtime: docker
    # The chat service uses ~400 MB of RAM at rest; if Render reports "out of memory" on the free
    # plan, move this service to a plan with more memory.
    plan: free
    region: singapore
    dockerContext: ./chat-service
    dockerfilePath: ./chat-service/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        fromService:
          type: web
          name: developeros-api
          envVarKey: JWT_SECRET
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: personalos
      - key: FRONTEND_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
