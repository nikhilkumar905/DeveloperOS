# Render Blueprint: creates the API and the chat service from this repository.
# Render dashboard -> New -> Blueprint -> pick this repo. Values marked `sync: false` are asked for
# during setup (they are secrets) and are never stored in the repo. Public URLs are set for developeros.page.
# Full guide: docs/DEPLOYMENT.md

services:
  - type: web
    name: developeros-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./fastapi-backend
    dockerfilePath: ./fastapi-backend/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      # Random secret generated by Render; the chat service reads the same value below
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: personalos
      # Public addresses (not secrets): site on Vercel, API on api.developeros.page
      - key: FRONTEND_URL
        value: https://developeros.page
      - key: CORS_ORIGINS
        value: https://www.developeros.page
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://api.developeros.page/api/auth/google/callback
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        value: https://api.developeros.page/api/github/callback
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: developeros-chat
    runtime: docker
    # Embeddings run on ONNX Runtime: ~110 MB at rest, ~270 MB peak while indexing a profile,
    # which fits the free plan's 512 MB.
    plan: free
    region: singapore
    dockerContext: ./chat-service
    dockerfilePath: ./chat-service/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        fromService:
          type: web
          name: developeros-api
          envVarKey: JWT_SECRET
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: personalos
      - key: FRONTEND_URL
        value: https://developeros.page
      - key: CORS_ORIGINS
        value: https://www.developeros.page
      - key: GROQ_API_KEY
        sync: false
