name: DeveloperOS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # ─── Backend Check ────────────────────────────────────────────────────────
      - name: Install Backend Dependencies
        run: cd backend && npm ci

      - name: Build Backend (TypeScript verification)
        run: cd backend && npm run build

      # ─── Frontend Check ───────────────────────────────────────────────────────
      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Lint Frontend
        run: cd frontend && npm run lint

      - name: Build Frontend
        run: cd frontend && npm run build

      # ─── Chrome Extension Check ───────────────────────────────────────────────
      - name: Install Chrome Extension Dependencies
        run: cd extensions/chrome && npm ci

      - name: Build Chrome Extension
        run: cd extensions/chrome && npm run build
