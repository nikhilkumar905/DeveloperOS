name: DeveloperOS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # ─── Backend Check ────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        run: cd fastapi-backend && pip install -r requirements.txt

      - name: Verify Backend Imports
        run: cd fastapi-backend && MONGO_URI=mongodb://localhost:27017 JWT_SECRET=ci-check-secret-that-is-long-enough-1234567890 python -c "import main"

      - name: Check Chat Service Syntax
        run: python -m py_compile chat-service/main.py chat-service/rag_engine.py chat-service/indexer.py chat-service/database.py chat-service/rate_limit.py chat-service/eval/run_eval.py chat-service/eval/compare.py

      # ─── Frontend Check ───────────────────────────────────────────────────────
      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Lint Frontend
        run: cd frontend && npm run lint

      - name: Build Frontend
        run: cd frontend && npm run build

      # ─── Chrome Extension Check ───────────────────────────────────────────────
      - name: Install Chrome Extension Dependencies
        run: cd extensions/chrome && npm ci

      - name: Build Chrome Extension
        run: cd extensions/chrome && npm run build

      # ─── Docker ───────────────────────────────────────────────────────────────
      - name: Validate Docker Compose
        run: JWT_SECRET=ci-check-secret-that-is-long-enough-1234567890 docker compose config -q
